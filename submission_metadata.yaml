reproduce_command: "python src/ranking.py --candidates data/candidates.jsonl --out output/submission.csv"

compute:
  platform: "Local laptop"
  cpu_cores: 8
  ram_gb: 16
  python_version: "3.11.4"
  os: "Linux"
  uses_gpu_for_inference: false
  has_network_during_ranking: false
  pre_computation_required: false
  pre_computation_time_minutes: 0

ai_tools_used:
  - "GitHub Copilot"

ai_usage_summary: |
  Used Copilot for autocomplete while writing Python code.
  No candidate data was fed to any LLM.

methodology_summary: |
  Three component weighted ranker. Skills component (40%) combines JD keyword
  matching with experience years fit, title match, and education tier. Semantic
  component (35%) uses all-MiniLM-L6-v2 sentence embeddings with cosine similarity
  between candidate text and JD. Behavioral component (25%) weights platform signals
  including activity recency, open-to-work flag, recruiter response rate, GitHub
  activity, and notice period.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: false
  reproduction_tested: true